# =====================================================================
# PYTEST CONFIGURATION
# Project: WSJ Customer Center Automation Tests
# =====================================================================

[pytest]

# ---------------------------------------------------------------------
# MARKERS
# ---------------------------------------------------------------------
markers =
    ui: UI tests using Playwright
    smoke: Smoke tests
    sanity: Sanity tests
    regression: Regression tests
    api: API tests
    performance: Performance tests
    database: Database tests
    critical: Critical tests

# ---------------------------------------------------------------------
# DEFAULT OPTIONS
# ---------------------------------------------------------------------
# IMPORTANT:
# Do NOT put --headed here.
# Headless/headed mode is controlled by GitHub Actions or CLI.
#
addopts =
    -v
    -s
    --color=yes
    --html=reports/PytestReport.html
    --self-contained-html
    --alluredir=reports/allure-results

# ---------------------------------------------------------------------
# TEST DISCOVERY
# ---------------------------------------------------------------------
testpaths = tests

python_files = test_*.py

python_classes = Test*

python_functions = test_*

# ---------------------------------------------------------------------
# WARNING FILTERS
# ---------------------------------------------------------------------
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning
    ignore::pytest.PytestUnknownMarkWarning

# ---------------------------------------------------------------------
# ENVIRONMENT
# ---------------------------------------------------------------------
env =
    ENV=test
    BASE_URL=https://opensource-demo.orangehrmlive.com/web/index.php/auth/login