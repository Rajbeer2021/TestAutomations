name: Deploy Playwright Dashboard

on:
  workflow_run:
    workflows: ["Playwright Tests"]
    types:
      - completed

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

jobs:

  deploy:

    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:

      # ==========================================================
      # 1. Checkout repository
      # ==========================================================
      - name: Checkout code
        uses: actions/checkout@v6


      # ==========================================================
      # 2. Download Playwright artifact
      # ==========================================================
      - name: Download Playwright Reports
        uses: actions/download-artifact@v5
        with:
          name: playwright-test-reports
          path: reports
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}


      # ==========================================================
      # 3. Inspect downloaded files
      # ==========================================================
      - name: Inspect reports
        run: |
          echo "=========================================="
          echo "DOWNLOADED REPORT FILES"
          echo "=========================================="

          find reports -type f | sort

          echo "=========================================="


      # ==========================================================
      # 4. Prepare GitHub Pages
      # ==========================================================
      - name: Prepare GitHub Pages
        run: |

          echo "Preparing reports..."

          # ------------------------------------------------------
          # Main Dashboard
          # ------------------------------------------------------

          if [ -f reports/custom_reports/dashboard.html ]; then

            cp reports/custom_reports/dashboard.html reports/index.html

            echo "Dashboard:"
            echo "reports/index.html"

          else

            echo "ERROR: dashboard.html not found!"
            exit 1

          fi


          # ------------------------------------------------------
          # Pytest HTML Report
          # ------------------------------------------------------

          if [ -f reports/PytestReport.html ]; then

            echo "PytestReport.html found."

          else

            echo "WARNING: PytestReport.html not found."

          fi


          # ------------------------------------------------------
          # Suite Reports
          # ------------------------------------------------------

          if [ -f reports/test_01_LoginHRM/test_01_LoginHRM_report.html ]; then
            echo "test_01_LoginHRM report found."
          else
            echo "WARNING: test_01_LoginHRM report not found."
          fi


          if [ -f reports/test_02_LoginHRM/test_02_LoginHRM_report.html ]; then
            echo "test_02_LoginHRM report found."
          else
            echo "WARNING: test_02_LoginHRM report not found."
          fi


          # ------------------------------------------------------
          # Final structure
          # ------------------------------------------------------

          echo ""
          echo "=========================================="
          echo "FINAL GITHUB PAGES STRUCTURE"
          echo "=========================================="

          find reports -type f | sort

          echo "=========================================="


      # ==========================================================
      # 5. Configure GitHub Pages
      # ==========================================================
      - name: Setup Pages
        uses: actions/configure-pages@v5


      # ==========================================================
      # 6. Upload ALL reports
      # ==========================================================
      - name: Upload Reports
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./reports


      # ==========================================================
      # 7. Deploy
      # ==========================================================
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
