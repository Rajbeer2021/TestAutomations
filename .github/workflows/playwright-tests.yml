name: Playwright Tests

on:

  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

    inputs:

      headed:
        description: "Run Playwright in headed mode?"
        required: true
        default: false
        type: boolean

      browser:
        description: "Select browser"
        required: true
        default: "chromium"
        type: choice
        options:
          - chromium
          - firefox
          - webkit

      test_file:
        description: "Test file to execute"
        required: true
        default: "tests/test_01_LoginHRM.py"
        type: string


# ================================================================
# PERMISSIONS
# ================================================================

permissions:

  contents: read

  pages: write

  id-token: write


# ================================================================
# JOBS
# ================================================================

jobs:


  # ================================================================
  # TEST JOB
  # ================================================================

  test:

    name: Playwright Tests

    runs-on: ubuntu-latest


    steps:


      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: Checkout code

        uses: actions/checkout@v5


      # ============================================================
      # 2. SETUP PYTHON
      # ============================================================

      - name: Setup Python

        uses: actions/setup-python@v6

        with:

          python-version: "3.12"


      # ============================================================
      # 3. DISPLAY ENVIRONMENT
      # ============================================================

      - name: Display environment information

        run: |

          echo "=============================================="

          echo "Environment Information"

          echo "=============================================="

          python --version

          pip --version

          pytest --version || true

          echo ""

          echo "Operating System:"

          uname -a

          echo ""

          echo "Working Directory:"

          pwd

          echo ""

          echo "=============================================="


      # ============================================================
      # 4. INSTALL DEPENDENCIES
      # ============================================================

      - name: Install dependencies

        run: |

          python -m pip install --upgrade pip

          python -m pip install -r requirements.txt

          python -m pip install \
            pytest-html \
            pytest-metadata


      # ============================================================
      # 5. INSTALL PLAYWRIGHT
      # ============================================================

      - name: Install Playwright browsers

        run: |

          python -m playwright install --with-deps \
            "${{ inputs.browser || 'chromium' }}"


      # ============================================================
      # 6. CREATE DIRECTORIES
      # ============================================================

      - name: Create report directories

        run: |

          mkdir -p reports

          mkdir -p test-results

          mkdir -p playwright-report

          mkdir -p screenshots

          mkdir -p videos

          mkdir -p traces

          mkdir -p github-pages

          mkdir -p github-pages/reports

          mkdir -p github-pages/test-results

          mkdir -p github-pages/screenshots

          mkdir -p github-pages/videos

          mkdir -p github-pages/traces


      # ============================================================
      # 7. TEST CONFIGURATION
      # ============================================================

      - name: Test configuration

        run: |

          echo "=============================================="

          echo "Playwright CI Test Configuration"

          echo "=============================================="

          echo "Browser:"

          echo "${{ inputs.browser || 'chromium' }}"

          echo ""

          echo "Test File:"

          echo "${{ inputs.test_file || 'tests/test_01_LoginHRM.py' }}"

          echo ""

          echo "Headed:"

          echo "${{ inputs.headed || false }}"

          echo ""

          echo "=============================================="


      # ============================================================
      # 8. RUN HEADLESS
      # ============================================================

      - name: Run pytest - Headless

        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.headed }}

        continue-on-error: true

        run: |

          pytest \
            "${{ inputs.test_file || 'tests/test_01_LoginHRM.py' }}" \
            -v \
            --html=reports/PytestReport.html \
            --self-contained-html \
            --metadata "Browser=${{ inputs.browser || 'chromium' }}" \
            --metadata "Mode=Headless" \
            --metadata "CI=GitHub Actions"


      # ============================================================
      # 9. RUN HEADED
      # ============================================================

      - name: Run pytest - Headed

        if: ${{ github.event_name == 'workflow_dispatch' && inputs.headed }}

        continue-on-error: true

        run: |

          xvfb-run -a \
          pytest \
            "${{ inputs.test_file }}" \
            -v \
            --html=reports/PytestReport.html \
            --self-contained-html \
            --metadata "Browser=${{ inputs.browser }}" \
            --metadata "Mode=Headed + Xvfb" \
            --metadata "CI=GitHub Actions"


      # ============================================================
      # 10. SHOW GENERATED FILES
      # ============================================================

      - name: Show generated reports

        if: always()

        run: |

          echo "=============================================="

          echo "Generated Files"

          echo "=============================================="

          echo ""

          echo "Reports:"

          find reports -type f -print || true

          echo ""

          echo "Test Results:"

          find test-results -type f -print || true

          echo ""

          echo "Screenshots:"

          find screenshots -type f -print || true

          echo ""

          echo "Videos:"

          find videos -type f -print || true

          echo ""

          echo "Traces:"

          find traces -type f -print || true

          echo ""

          echo "=============================================="


      # ============================================================
      # 11. PREPARE GITHUB PAGES
      # ============================================================

      - name: Prepare GitHub Pages files

        if: always()

        run: |

          echo "Preparing GitHub Pages deployment..."

          # --------------------------------------------------------
          # Copy Pytest report
          # --------------------------------------------------------

          if [ -f "reports/PytestReport.html" ]; then

            cp reports/PytestReport.html \
              github-pages/PytestReport.html

          else

            cat > github-pages/PytestReport.html <<'EOF'
          <!DOCTYPE html>
          <html>
          <head>
            <meta charset="UTF-8">
            <title>Pytest Report</title>
          </head>
          <body>
            <h1>Pytest Report Not Available</h1>
            <p>No PytestReport.html was generated.</p>
          </body>
          </html>
          EOF

          fi


          # --------------------------------------------------------
          # Copy test artifacts
          # --------------------------------------------------------

          if [ -d "test-results" ]; then

            cp -r test-results/. \
              github-pages/test-results/ || true

          fi


          if [ -d "screenshots" ]; then

            cp -r screenshots/. \
              github-pages/screenshots/ || true

          fi


          if [ -d "videos" ]; then

            cp -r videos/. \
              github-pages/videos/ || true

          fi


          if [ -d "traces" ]; then

            cp -r traces/. \
              github-pages/traces/ || true

          fi


          if [ -d "reports" ]; then

            cp -r reports/. \
              github-pages/reports/ || true

          fi


      # ============================================================
      # 12. CREATE CI DASHBOARD
      # ============================================================

      - name: Create CI Dashboard

        if: always()

        run: |

          cat > github-pages/index.html <<'EOF'
          <!DOCTYPE html>

          <html>

          <head>

            <meta charset="UTF-8">

            <meta name="viewport"
                  content="width=device-width, initial-scale=1">

            <title>Playwright CI/CD Dashboard</title>

            <style>

              * {
                box-sizing: border-box;
              }

              body {

                margin: 0;

                font-family:
                  Arial,
                  Helvetica,
                  sans-serif;

                background:
                  linear-gradient(
                    135deg,
                    #eef2ff,
                    #f8fafc
                  );

                color: #1e293b;

              }


              .header {

                background: #111827;

                color: white;

                padding: 35px 45px;

              }


              .header h1 {

                margin: 0;

                font-size: 32px;

              }


              .header p {

                margin: 10px 0 0;

                color: #cbd5e1;

              }


              .container {

                max-width: 1200px;

                margin: 35px auto;

                padding: 0 20px;

              }


              .grid {

                display: grid;

                grid-template-columns:
                  repeat(
                    auto-fit,
                    minmax(
                      260px,
                      1fr
                    )
                  );

                gap: 22px;

              }


              .card {

                background: white;

                border-radius: 16px;

                padding: 26px;

                box-shadow:
                  0 8px 25px
                  rgba(
                    15,
                    23,
                    42,
                    0.08
                  );

                transition:
                  transform 0.2s,
                  box-shadow 0.2s;

              }


              .card:hover {

                transform:
                  translateY(-5px);

                box-shadow:
                  0 14px 35px
                  rgba(
                    15,
                    23,
                    42,
                    0.12
                  );

              }


              .icon {

                font-size: 40px;

              }


              .title {

                font-size: 21px;

                font-weight: bold;

                margin-top: 12px;

              }


              .description {

                color: #64748b;

                margin-top: 10px;

                line-height: 1.6;

                min-height: 50px;

              }


              .button {

                display: inline-block;

                margin-top: 20px;

                padding:
                  11px 20px;

                background: #2563eb;

                color: white;

                border-radius: 9px;

                text-decoration: none;

                font-weight: bold;

              }


              .button:hover {

                background: #1d4ed8;

              }


              .info {

                margin-top: 30px;

              }


              .info table {

                width: 100%;

                border-collapse:
                  collapse;

              }


              .info td {

                padding: 13px;

                border-bottom:
                  1px solid #e2e8f0;

              }


              .info td:first-child {

                font-weight: bold;

                width: 220px;

              }


              .footer {

                text-align: center;

                padding: 35px;

                color: #64748b;

              }

            </style>

          </head>


          <body>


            <div class="header">

              <h1>
                🎭 Playwright CI/CD Dashboard
              </h1>

              <p>
                Automated UI Test Execution & Reporting
              </p>

            </div>


            <div class="container">


              <div class="grid">


                <!-- PYTEST -->

                <div class="card">

                  <div class="icon">
                    🧪
                  </div>

                  <div class="title">
                    Pytest Report
                  </div>

                  <div class="description">

                    Detailed pytest execution
                    results including passed,
                    failed and skipped tests.

                  </div>

                  <a
                    class="button"
                    href="PytestReport.html">

                    Open Report

                  </a>

                </div>


                <!-- REPORTS -->

                <div class="card">

                  <div class="icon">
                    📊
                  </div>

                  <div class="title">
                    Test Reports
                  </div>

                  <div class="description">

                    Additional generated test
                    reports and execution files.

                  </div>

                  <a
                    class="button"
                    href="reports/">

                    Open Reports

                  </a>

                </div>


                <!-- SCREENSHOTS -->

                <div class="card">

                  <div class="icon">
                    📸
                  </div>

                  <div class="title">
                    Screenshots
                  </div>

                  <div class="description">

                    Screenshots captured during
                    Playwright test execution.

                  </div>

                  <a
                    class="button"
                    href="screenshots/">

                    View Screenshots

                  </a>

                </div>


                <!-- VIDEOS -->

                <div class="card">

                  <div class="icon">
                    🎥
                  </div>

                  <div class="title">
                    Videos
                  </div>

                  <div class="description">

                    Browser execution recordings
                    from Playwright tests.

                  </div>

                  <a
                    class="button"
                    href="videos/">

                    View Videos

                  </a>

                </div>


                <!-- TRACES -->

                <div class="card">

                  <div class="icon">
                    🔍
                  </div>

                  <div class="title">
                    Trace Files
                  </div>

                  <div class="description">

                    Playwright trace files for
                    debugging failed tests.

                  </div>

                  <a
                    class="button"
                    href="traces/">

                    View Traces

                  </a>

                </div>


                <!-- TEST RESULTS -->

                <div class="card">

                  <div class="icon">
                    📁
                  </div>

                  <div class="title">
                    Test Results
                  </div>

                  <div class="description">

                    Raw Playwright and pytest
                    test result files.

                  </div>

                  <a
                    class="button"
                    href="test-results/">

                    View Results

                  </a>

                </div>


                <!-- GITHUB -->

                <div class="card">

                  <div class="icon">
                    ⚙️
                  </div>

                  <div class="title">
                    GitHub Actions
                  </div>

                  <div class="description">

                    Open the complete GitHub
                    Actions execution.

                  </div>

                  <a
                    class="button"
                    href="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}">

                    Open CI Run

                  </a>

                </div>


              </div>


              <!-- EXECUTION INFORMATION -->

              <div class="card info">

                <h2>
                  Execution Information
                </h2>

                <table>


                  <tr>

                    <td>
                      Repository
                    </td>

                    <td>
                      ${{ github.repository }}
                    </td>

                  </tr>


                  <tr>

                    <td>
                      Branch
                    </td>

                    <td>
                      ${{ github.ref_name }}
                    </td>

                  </tr>


                  <tr>

                    <td>
                      Commit
                    </td>

                    <td>
                      ${{ github.sha }}
                    </td>

                  </tr>


                  <tr>

                    <td>
                      Browser
                    </td>

                    <td>
                      ${{ inputs.browser || 'chromium' }}
                    </td>

                  </tr>


                  <tr>

                    <td>
                      Execution Mode
                    </td>

                    <td>
                      ${{ inputs.headed && 'Headed + Xvfb' || 'Headless' }}
                    </td>

                  </tr>


                  <tr>

                    <td>
                      Test File
                    </td>

                    <td>
                      ${{ inputs.test_file || 'tests/test_01_LoginHRM.py' }}
                    </td>

                  </tr>


                  <tr>

                    <td>
                      Run ID
                    </td>

                    <td>
                      ${{ github.run_id }}
                    </td>

                  </tr>


                </table>

              </div>


            </div>


            <div class="footer">

              Generated automatically by
              GitHub Actions

            </div>


          </body>

          </html>
          EOF


      # ============================================================
      # 13. SHOW PAGES CONTENT
      # ============================================================

      - name: Show GitHub Pages content

        if: always()

        run: |

          echo "=============================================="

          echo "GitHub Pages Files"

          echo "=============================================="

          find github-pages -type f -print

          echo ""

          echo "=============================================="


      # ============================================================
      # 14. UPLOAD COMPLETE ARTIFACT
      # ============================================================

      - name: Upload complete test reports

        if: always()

        uses: actions/upload-artifact@v4

        with:

          name: playwright-test-reports

          path: |

            reports/

            test-results/

            playwright-report/

            screenshots/

            videos/

            traces/

            github-pages/

          if-no-files-found: ignore

          retention-days: 30


      # ============================================================
      # 15. UPLOAD GITHUB PAGES
      # ============================================================

      - name: Upload dashboard to GitHub Pages

        if: always()

        uses: actions/upload-pages-artifact@v4

        with:

          path: github-pages/


  # ================================================================
  # DEPLOY JOB
  # ================================================================

  deploy:

    name: Deploy Playwright Dashboard

    needs: test

    if: always()

    runs-on: ubuntu-latest


    permissions:

      pages: write

      id-token: write


    environment:

      name: github-pages

      url: ${{ steps.deployment.outputs.page_url }}


    steps:


      # ============================================================
      # DEPLOY
      # ============================================================

      - name: Deploy to GitHub Pages

        id: deployment

        uses: actions/deploy-pages@v4
